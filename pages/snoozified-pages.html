<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>snoozify</title>
	<link rel="stylesheet" type="text/css" href="/styles/popup.css">
	<script src="snoozified-pages.js" type="module"></script>
</head>
<body>
	<h4><a href="popup.html">← snoozify</a></h4>
	<h1>snoozified pages</h1>

	<nav class="tabs" role="tablist">
		<button id="tab-scheduled" class="tab tab--active" role="tab" aria-selected="true">Scheduled</button>
		<button id="tab-history" class="tab" role="tab" aria-selected="false">History</button>
	</nav>

	<p id="quota-warning" class="quota-warning" hidden></p>

	<section id="scheduled-panel" role="tabpanel">
		<div id="page-links"></div>
	</section>

	<section id="history-panel" role="tabpanel" hidden>
		<div id="history-list"></div>
	</section>

	<button id="export-button">Export</button>
	<button id="import-button">Import</button>
	<input type="file" id="import-file-input" style="display: none;" accept=".json">
	<button id="clear-button">Clear all</button>


	<template id="date-group-template">
		<h2 class="date-group__date">
			<span class="date-group__date-text"></span>
			<span class="date-group__count"></span>
		</h2>
		<div class="date-group__pages"></div>
	</template>

	<template id="page-link-template">
		<div class="page-link">
			<a class="page-link__url" href=""><h3 class="page-link__title"></h3></a>
			<div class="page-link__details">
				<span class="page-link__wakeupdate"></span>
				<button class="page-link__wakeup-button">Wake up</button>
			</div>
		</div>
	</template>

</body>
</html>
